<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISP Reporting Portal</title>
    <style>
        body { font-family: sans-serif; background-color: #121212; color: #ffffff; padding: 20px; }
        .container { max-width: 450px; background: #1e1e1e; padding: 20px; border-radius: 8px; margin: auto; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; }
        input[type="text"] { width: 100%; padding: 12px; box-sizing: border-box; border: 1px solid #333; border-radius: 6px; background-color: #2a2a2a; color: #fff; font-size: 16px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-group">
            <label>Customer ID (User ID) *</label>

            <!-- Customer ID ထည့်ရန် အကွက် -->
            <input type="text" id="customerId" placeholder="ဥပမာ - Tty01072" required>

            <!-- နာမည် ပေါ်လာမည့် နေရာ -->
            <small id="customerNameDisplay" style="color: #4caf50; font-weight: bold; margin-top: 8px; display: block; font-size: 14px;"></small>
        </div>
    </div>

    <!-- API လှမ်းခေါ်မည့် JavaScript (ဖိုင်ရဲ့ အောက်ဆုံးတွင် ထည့်ရပါမည်) -->
    <script>
    document.getElementById('customerId').addEventListener('input', async function() {
        const customerId = this.value.trim();
        const nameDisplay = document.getElementById('customerNameDisplay');
        
        if (!customerId) {
            nameDisplay.innerText = '';
            return;
        }

        try {
            const response = await fetch(`/api/get-customer/${customerId}`);
            const data = await response.json();

            if (data.success) {
                nameDisplay.innerText = `👤 Name: ${data.username}`;
            } else {
                nameDisplay.innerText = `❌ ${data.message}`;
            }
        } catch (error) {
            console.error('Error:', error);
        }
    });
    </script>
</body>
</html>
