<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internet ပြဿနာ တင်ပြရန်</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: #ffffff; padding: 20px; margin: 0; }
        .container { max-width: 420px; background: #1e1e1e; padding: 25px; border-radius: 16px; margin: 20px auto; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h2 { text-align: center; color: #ffffff; margin-bottom: 25px; font-size: 22px; font-weight: 700; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 10px; font-weight: 600; font-size: 14px; color: #a0aec0; }
        input[type="text"], input[type="password"] { width: 100%; padding: 14px; box-sizing: border-box; border: 1.5px solid #333333; border-radius: 10px; background-color: #2a2a2a; color: #ffffff; font-size: 15px; outline: none; }
        input[type="text"]:focus, input[type="password"]:focus { border-color: #38a169; }
        
        .issue-grid { display: flex; flex-direction: column; gap: 10px; }
        .issue-row { display: flex; gap: 10px; }
        .issue-btn { flex: 1; padding: 14px; background-color: #2a2a2a; border: 1.5px solid #333333; border-radius: 10px; font-size: 14px; font-weight: 600; color: #ffffff; cursor: pointer; text-align: center; display: flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.2s; }
        .issue-btn.active { border-color: #38a169; background-color: #1a382b; color: #38a169; box-shadow: 0 0 0 1px #38a169; }

        .submit-btn { width: 100%; padding: 16px; background-color: #27a745; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 20px; }
        .submit-btn:hover { background-color: #218838; }
        #customerNameDisplay { margin-top: 8px; display: block; font-size: 14px; font-weight: 600; }
        
        #passwordGroup { display: none; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Internet ပြဿနာ တင်ပြရန်</h2>
        <form id="reportForm">
            <div class="form-group">
                <label>Customer ID (User ID) *</label>
                <input type="text" id="customerId" placeholder="ဥပမာ - TTY01234" required autocomplete="off">
                <small id="customerNameDisplay"></small>
            </div>

            <div class="form-group">
                <label>ကြုံတွေ့နေရသော ပြဿနာ ရွေးချယ်ပါ *</label>
                <div class="issue-grid">
                    <div class="issue-row">
                        <div class="issue-btn" onclick="selectIssue(this, '🔴 မီးနီ')">🔴 မီးနီ</div>
                        <div class="issue-btn" onclick="selectIssue(this, '🐢 လိုင်းနှေး')">🐢 လိုင်းနှေး</div>
                    </div>
                    <div class="issue-btn" onclick="selectIssue(this, '🟡 PON မီးခုန် / မီးသုံးလုံးလင်းပြီး လိုင်းသုံးမရ')">🟡 PON မီးခုန် / မီးသုံးလုံးလင်းပြီး လိုင်းသုံးမရ</div>
                    <div class="issue-btn" onclick="selectIssue(this, '⚡ Power တစ်ခုပဲလင်း')">⚡ Power တစ်ခုပဲလင်း</div>
                    <div class="issue-btn" onclick="selectIssue(this, '🔑 Password change (စကားဝှက်ပြောင်းရန်)')">🔑 Password change (စကားဝှက်ပြောင်းရန်)</div>
                </div>
            </div>

            <!-- Password အသစ်တောင်းမည့် Input Box -->
            <div class="form-group" id="passwordGroup">
                <label>စကားဝှက်အသစ် (New Password) *</label>
                <input type="text" id="newPassword" placeholder="ပြောင်းလဲလိုသော စကားဝှက်အသစ် ရိုက်ထည့်ပါ">
            </div>

            <button type="submit" class="submit-btn">ပြဿနာအား တင်ပြမည်</button>
        </form>
    </div>

    <script>
    let fetchedName = '';
    let selectedIssueText = '';

    function selectIssue(element, value) {
        document.querySelectorAll('.issue-btn').forEach(btn => btn.classList.remove('active'));
        element.classList.add('active');
        selectedIssueText = value;

        const passGroup = document.getElementById('passwordGroup');
        const passInput = document.getElementById('newPassword');

        // Password change ရွေးထားလျှင် Input Box ဖော်ပေးရန်
        if (value.includes('Password change')) {
            passGroup.style.display = 'block';
            passInput.required = true;
        } else {
            passGroup.style.display = 'none';
            passInput.required = false;
            passInput.value = '';
        }
    }

    document.getElementById('customerId').addEventListener('input', async function() {
        const customerId = this.value.trim();
        const nameDisplay = document.getElementById('customerNameDisplay');
        
        if (!customerId) {
            nameDisplay.innerText = '';
            fetchedName = '';
            return;
        }

        try {
            const response = await fetch(`/api/get-customer/${customerId}`);
            const data = await response.json();

            if (data.success) {
                fetchedName = data.username;
                nameDisplay.style.color = '#38a169';
                nameDisplay.innerText = `👤 Name: ${data.username}`;
            } else {
                fetchedName = '';
                nameDisplay.style.color = '#e53e3e';
                nameDisplay.innerText = `❌ ${data.message}`;
            }
        } catch (error) {
            console.error('Error:', error);
        }
    });

    document.getElementById('reportForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const customerId = document.getElementById('customerId').value.trim();
        const newPassword = document.getElementById('newPassword').value.trim();

        if (!fetchedName) {
            alert('ကျေးဇူးပြု၍ မှန်ကန်သော Customer ID ထည့်ပေးပါ');
            return;
        }

        if (!selectedIssueText) {
            alert('ကျေးဇူးပြု၍ ပြဿနာတစ်ခုခုကို ရွေးချယ်ပေးပါ');
            return;
        }

        let finalIssueText = selectedIssueText;
        if (selectedIssueText.includes('Password change')) {
            if (!newPassword) {
                alert('ကျေးဇူးပြု၍ စကားဝှက်အသစ် ထည့်သွင်းပေးပါ');
                return;
            }
            finalIssueText = `${selectedIssueText}\n🔑 *New Password:* \`${newPassword}\``;
        }

        try {
            const response = await fetch('/api/submit-report', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    customerId: customerId,
                    customerName: fetchedName,
                    issue: finalIssueText
                })
            });

            const result = await response.json();
            if (result.success) {
                alert('Report အောင်မြင်စွာ တင်ပြပြီးပါပြီ။');
                document.getElementById('reportForm').reset();
                document.getElementById('customerNameDisplay').innerText = '';
                document.querySelectorAll('.issue-btn').forEach(btn => btn.classList.remove('active'));
                document.getElementById('passwordGroup').style.display = 'none';
                fetchedName = '';
                selectedIssueText = '';
            } else {
                alert(result.message);
            }
        } catch (err) {
            alert('Network Error ဖြစ်ပွားနေပါသည်။');
        }
    });
    </script>
</body>
</html>
