<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISP Customer Report Portal</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 450px;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        h2 { text-align: center; color: #4CAF50; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select, button, textarea {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #2a2a2a;
            color: #fff;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            font-weight: bold;
            border: none;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover { background-color: #45a049; }
        .hidden { display: none; }
        .info-box {
            background: #282828;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 4px solid #4CAF50;
        }
        .info-box p { margin: 5px 0; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <h2>ISP Customer Support</h2>

    <!-- Step 1: Customer ID Search -->
    <div id="searchSection" class="form-group">
        <label for="customerId">Customer ID ရိုက်ထည့်ပါ:</label>
        <input type="text" id="customerId" placeholder="Eg. TTY01072 သို့မဟုတ် 1072">
        <button id="searchBtn">စစ်ဆေးမည်</button>
    </div>

    <!-- Loading Indicator -->
    <div id="loading" class="hidden" style="text-align:center; padding:10px;">
        <p>⏳ အချက်အလက်များ စစ်ဆေးနေပါသည်။ ခဏစောင့်ပါ...</p>
    </div>

    <!-- Step 2: Customer Details & Form -->
    <div id="reportSection" class="hidden">
        <div class="info-box">
            <p>👤 <b>Name:</b> <span id="dispName">-</span></p>
            <p>🆔 <b>Customer ID:</b> <span id="dispId">-</span></p>
            <p>📦 <b>FAT Box:</b> <span id="dispFat">-</span></p>
            <p>📡 <b>Status:</b> <span id="dispStatus">-</span></p>
            <p>📶 <b>Signal Power:</b> <span id="dispSignal">-</span></p>
        </div>

        <form id="reportForm">
            <div class="form-group">
                <label for="issueType">ကြုံတွေ့နေရသော ပြဿနာကို ရွေးပါ:</label>
                <select id="issueType" required>
                    <option value="">-- ပြဿနာအမျိုးအစား ရွေးချယ်ပါ --</option>
                    <option value="မီးနီ">🔴 မီးနီ (LOS / Signal Drop)</option>
                    <option value="Power တစ်ခုပဲလင်း">⚡ Power တစ်ခုပဲလင်း</option>
                    <option value="No Power (မီးလုံးဝမလာပါ)">🔌 No Power (မီးလုံးဝမလာပါ)</option>
                    <option value="Password change (စကားဝှက်ပြောင်းရန်)">🔑 Password change (စကားဝှက်ပြောင်းရန်)</option>
                    <option value="အခြားပြဿနာ">❓ အခြားပြဿနာ</option>
                </select>
            </div>

            <!-- Password Change Input Box (Password change ရွေးမှ ပေါ်မည်) -->
            <div id="passwordBox" class="form-group hidden">
                <label for="newPassword">🔑 ပြောင်းလဲချင်သော Password အသစ် ရိုက်ထည့်ပါ:</label>
                <input type="text" id="newPassword" placeholder="Password အသစ် ရိုက်ထည့်ပါ">
            </div>

            <!-- Other Issue Description (အခြားပြဿနာ သို့မဟုတ် အသေးစိတ်) -->
            <div id="otherIssueBox" class="form-group hidden">
                <label for="customIssue">အသေးစိတ် ဖော်ပြပေးပါ:</label>
                <textarea id="customIssue" rows="3" placeholder="ဖြစ်ပေါ်နေသော ပြဿနာအား အသေးစိတ် ရေးသားပေးပါ"></textarea>
            </div>

            <button type="submit" id="submitBtn">ပြဿနာအား တင်ပြမည်</button>
        </form>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
